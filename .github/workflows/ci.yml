name: Verification Formelle & Benchmarks v21.1

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-tests:
    name: Tests Unitaires Python v21.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configuration Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Exécution du moteur dual et certification Pocklington
        run: python3 la_machine_v21.py

  lean4-proofs:
    name: Preuves Formelles Lean 4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilation et vérification Lean 4
        uses: leanprover/lean-action@v1
